version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms_password
      POSTGRES_DB: hrms_db
    ports:
      - '5432:5432'
    volumes:
      - hrms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrms']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hrms-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - hrms_redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrms-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://hrms:hrms_password@postgres:5432/hrms_db?schema=public
      REDIS_HOST: redis
    ports:
      - '3001:3001'
    # Note: seed only runs on first deploy. Remove 'npx prisma db seed' if data already exists
    command: sh -c "npx prisma migrate deploy && node dist/main"

volumes:
  hrms_postgres_data:
  hrms_redis_data:
